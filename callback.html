<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization — 0day.story</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#111;background:#fff}h1{font-size:1.6em}code{background:#eee;padding:2px 6px;border-radius:4px;word-break:break-all}</style></head><body>
<h1>Authorization</h1>
<p id="msg">Waiting for TikTok…</p>
<p><code id="code"></code></p>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get("code"), err = p.get("error");
  var msg = document.getElementById("msg");
  if (code) { msg.textContent = "Copy this code into exchange_code():"; document.getElementById("code").textContent = code; }
  else if (err) { msg.textContent = "Error: " + err + " " + (p.get("error_description") || ""); }
</script>
</body></html>
